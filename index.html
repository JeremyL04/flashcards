<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Keep this page out of search results. Crawling stays allowed on
       purpose: a robots.txt block would hide this tag from crawlers, and
       the bare URL could still be listed. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <title>Flashcards</title>
  <!-- ?v= busts the browser cache. Bump these when you deploy a change. -->
  <link rel="stylesheet" href="styles.css?v=30" />
</head>
<body>
  <header class="topbar" hidden>
    <div class="topbar-inner">
      <div class="topbar-left">
        <button id="home-btn" class="home-btn" type="button">Home</button>
        <h1 id="deck-title"></h1>
      </div>
      <div class="topbar-right">
        <span id="timer" class="timer" hidden></span>
        <p id="phase-label"></p>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
  </header>

  <main id="app"></main>

  <script src="cards.js?v=30"></script>
  <script src="app.js?v=30"></script>
</body>
</html>
